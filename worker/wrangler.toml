name = "ptpchat-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Custom domain - routes WebSocket traffic through your domain
routes = [
  { pattern = "ws.ptpchat.com", custom_domain = true }
]

[durable_objects]
bindings = [
  { name = "MATCHMAKER", class_name = "Matchmaker" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker"]
